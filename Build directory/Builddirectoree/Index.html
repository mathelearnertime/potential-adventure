<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dogeub | Floral Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        :root {
            /* Default Pink Theme */
            --primary: #ff69b4;
            --secondary: #ffb7c5;
            --bg-dark: #2a1a20;
            --bg-sidebar: rgba(42, 26, 32, 0.95);
            --text-main: #fff0f5;
            --card-bg: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(255, 255, 255, 0.9);
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            height: 100vh;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* 🌸 Falling Petals Animation */
        .petal {
            position: absolute;
            top: -10%;
            width: 15px;
            height: 15px;
            background: radial-gradient(circle, var(--secondary) 0%, var(--primary) 100%);
            border-radius: 150% 0 150% 0;
            opacity: 0.6;
            animation: fall linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* Generate random petals */
        .petal:nth-child(1) { left: 10%; animation-duration: 12s; animation-delay: 0s; }
        .petal:nth-child(2) { left: 20%; animation-duration: 15s; animation-delay: 2s; }
        .petal:nth-child(3) { left: 30%; animation-duration: 10s; animation-delay: 4s; }
        .petal:nth-child(4) { left: 40%; animation-duration: 18s; animation-delay: 1s; }
        .petal:nth-child(5) { left: 50%; animation-duration: 14s; animation-delay: 3s; }
        .petal:nth-child(6) { left: 60%; animation-duration: 11s; animation-delay: 5s; }
        .petal:nth-child(7) { left: 70%; animation-duration: 16s; animation-delay: 0.5s; }
        .petal:nth-child(8) { left: 80%; animation-duration: 13s; animation-delay: 2.5s; }
        .petal:nth-child(9) { left: 90%; animation-duration: 17s; animation-delay: 1.5s; }
        .petal:nth-child(10) { left: 15%; animation-duration: 19s; animation-delay: 4.5s; }

        /* Sidebar */
        .sidebar {
            width: 220px;
            background: var(--bg-sidebar);
            border-right: 2px solid var(--primary);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
            transition: border-color 0.5s ease;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 20px;
            transition: color 0.5s ease;
        }

        .nav-item {
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-main);
            font-size: 14px;
        }

        .nav-item:hover {
            background: var(--card-bg);
            color: var(--primary);
        }

        .settings-panel {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid var(--card-bg);
            display: none; /* Hidden by default */
        }

        .settings-panel.active {
            display: block;
        }

        .setting-group {
            margin-bottom: 15px;
        }

        .setting-label {
            font-size: 12px;
            margin-bottom: 5px;
            display: block;
            color: var(--secondary);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
        }

        select {
            width: 100%;
            padding: 5px;
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--primary);
            border-radius: 5px;
        }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        /* Search Bar */
        .search-container {
            width: 60%;
            max-width: 600px;
            margin-bottom: 30px;
            position: relative;
        }

        .search-bar {
            width: 100%;
            padding: 15px 50px;
            border-radius: 25px;
            border: 2px solid var(--primary);
            background: var(--input-bg);
            font-size: 18px;
            outline: none;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
            transition: border-color 0.5s ease, background 0.5s ease;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            transition: color 0.5s ease;
        }

        /* Shortcuts */
        .shortcuts {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .shortcut {
            width: 80px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .shortcut:hover {
            transform: scale(1.1);
        }

        .icon-circle {
            width: 60px;
            height: 60px;
            background: var(--card-bg);
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 1px solid var(--primary);
            transition: border-color 0.5s ease, background 0.5s ease;
        }

        .shortcut span {
            font-size: 12px;
            color: var(--text-main);
        }

        /* Iframe Container */
        .browser-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            z-index: 2;
            display: none;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 240px;
            z-index: 20;
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            display: none;
            transition: background-color 0.5s ease;
        }

        /* Vines */
        .vine-left, .vine-right {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M10,0 Q30,50 10,100" fill="none" stroke="%23ff69b4" stroke-width="2"/></svg>');
            background-repeat: repeat-y;
            opacity: 0.3;
            z-index: 0;
        }
        .vine-left { left: 0; }
        .vine-right { right: 0; }

    </style>
</head>
<body>

    <!-- Falling Petals -->
    <div class="petal"></div><div class="petal"></div><div class="petal"></div>
    <div class="petal"></div><div class="petal"></div><div class="petal"></div>
    <div class="petal"></div><div class="petal"></div><div class="petal"></div>
    <div class="petal"></div>

    <!-- Vines -->
    <div class="vine-left"></div>
    <div class="vine-right"></div>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo-area">
            <span>🌸</span> Dogeub
        </div>
        
        <!-- Settings Toggle -->
        <div class="nav-item" id="settingsToggle">⚙️ Settings</div>

        <!-- Settings Panel -->
        <div class="settings-panel" id="settingsPanel">
            <div class="setting-group">
                <label class="setting-label">Base Hue (0-360)</label>
                <input type="range" id="hueSlider" min="0" max="360" value="330">
            </div>
            
            <div class="setting-group">
                <label class="setting-label">Quick Themes</label>
                <select id="themeSelect">
                    <option value="custom">Custom (Slider)</option>
                    <option value="pink">Floral Pink</option>
                    <option value="ocean">Ocean Blue</option>
                    <option value="forest">Forest Green</option>
                    <option value="sunset">Sunset Orange</option>
                    <option value="lavender">Lavender Purple</option>
                    <option value="midnight">Midnight Black</option>
                    <option value="gold">Royal Gold</option>
                    <option value="cyber">Cyber Cyan</option>
                </select>
            </div>

            <div style="font-size: 11px; opacity: 0.7; margin-top: 10px;">
                Themes: ~250+<br>Generated dynamically.
            </div>
        </div>

        <div style="margin-top: auto; font-size: 12px; opacity: 0.7;">
            Support us · Disable Ads
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="homeView">
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-bar" id="searchInput" placeholder="Search Google or enter URL..." onkeydown="if(event.key==='Enter') performSearch()">
        </div>

        <div class="shortcuts">
            <div class="shortcut" onclick="loadSite('https://www.google.com')">
                <div class="icon-circle" style="color:#4285F4">G</div>
                <span>Google</span>
            </div>
            <div class="shortcut" onclick="loadSite('https://www.youtube.com')">
                <div class="icon-circle" style="color:#FF0000">▶</div>
                <span>Movies</span>
            </div>
            <div class="shortcut" onclick="loadSite('https://discord.com')">
                <div class="icon-circle" style="color:#5865F2">👽</div>
                <span>Discord</span>
            </div>
            <div class="shortcut" onclick="loadSite('https://github.com')">
                <div class="icon-circle" style="color:#333">🐙</div>
                <span>GitHub</span>
            </div>
            <div class="shortcut" onclick="goHome()">
                <div class="icon-circle">+</div>
                <span>New</span>
            </div>
        </div>
    </div>

    <!-- Browser Frame -->
    <button class="back-btn" onclick="goHome()">← Back</button>
    <iframe id="proxyFrame" class="browser-frame" src=""></iframe>

    <script>
        const frame = document.getElementById('proxyFrame');
        const homeView = document.getElementById('homeView');
        const backBtn = document.querySelector('.back-btn');
        const input = document.getElementById('searchInput');
        const settingsToggle = document.getElementById('settingsToggle');
        const settingsPanel = document.getElementById('settingsPanel');
        const hueSlider = document.getElementById('hueSlider');
        const themeSelect = document.getElementById('themeSelect');

        // Theme Logic
        function setTheme(hue) {
            // Calculate colors based on hue
            const primary = `hsl(${hue}, 100%, 70%)`;
            const secondary = `hsl(${hue}, 100%, 85%)`;
            const bgDark = `hsl(${hue}, 20%, 15%)`;
            const bgSidebar = `hsl(${hue}, 20%, 18%)`;
            const textMain = `hsl(${hue}, 20%, 95%)`;
            const cardBg = `rgba(255, 255, 255, 0.1)`;
            const inputBg = `rgba(255, 255, 255, 0.9)`;

            document.documentElement.style.setProperty('--primary', primary);
            document.documentElement.style.setProperty('--secondary', secondary);
            document.documentElement.style.setProperty('--bg-dark', bgDark);
            document.documentElement.style.setProperty('--bg-sidebar', bgSidebar);
            document.documentElement.style.setProperty('--text-main', textMain);
            document.documentElement.style.setProperty('--card-bg', cardBg);
            document.documentElement.style.setProperty('--input-bg', inputBg);
        }

        // Preset Themes
        const presets = {
            'pink': 330,
            'ocean': 210,
            'forest': 140,
            'sunset': 25,
            'lavender': 270,
            'midnight': 240,
            'gold': 45,
            'cyber': 180
        };

        // Event Listeners
        settingsToggle.addEventListener('click', () => {
            settingsPanel.classList.toggle('active');
        });

        hueSlider.addEventListener('input', (e) => {
            setTheme(e.target.value);
            themeSelect.value = 'custom';
        });

        themeSelect.addEventListener('change', (e) => {
            if (e.target.value !== 'custom') {
                const hue = presets[e.target.value];
                setTheme(hue);
                hueSlider.value = hue;
            } else {
                setTheme(hueSlider.value);
            }
        });

        // Initialize Default Theme
        setTheme(330); // Start with pink

        function performSearch() {
            let query = input.value.trim();
            if (!query) return;

            if (query.includes('.') && !query.includes(' ')) {
                if (!query.startsWith('http')) {
                    query = 'https://' + query;
                }
                loadSite(query);
            } else {
                window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
            }
        }

        function loadSite(url) {
            frame.src = url;
            homeView.style.display = 'none';
            backBtn.style.display = 'block';
            frame.style.display = 'block';
            settingsPanel.classList.remove('active'); // Close settings when browsing
        }

        function goHome() {
            frame.src = '';
            homeView.style.display = 'flex';
            backBtn.style.display = 'none';
            input.value = '';
        }
    </script>
</body>
</html>
